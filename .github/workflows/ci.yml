name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Match CONTRIBUTING.md: lint tests too (`--all-targets`).
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: russel-binaries
          path: |
            target/release/russel
            target/release/russel-ctrl

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: bun test
        working-directory: dashboard
      - run: bun run build
        working-directory: dashboard

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        env:
          # Follow `source` so library vars (BOLD, VAR_LIB_REDIRECTED, …) resolve.
          SHELLCHECK_OPTS: -x
        with:
          ignore_paths: guide dashboard examples

  installer:
    name: Installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Pinned to actions/checkout v4 (immutable SHA, not the mutable tag).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run installer tests
        run: bash contrib/tests/install_test.sh
      - name: Verify systemd user unit
        run: |
          set -euo pipefail
          cleanup() {
            sudo rm -f /usr/local/bin/russel-ctrl
            sudo rmdir /var/lib/russel 2>/dev/null || true
          }
          trap cleanup EXIT
          mkdir -p "$HOME/.config/russel"
          : >"$HOME/.config/russel/env"
          chmod 600 "$HOME/.config/russel/env"
          sudo install -m 755 /bin/true /usr/local/bin/russel-ctrl
          sudo mkdir -p /var/lib/russel
          systemd-analyze verify contrib/russel-ctrl.service
