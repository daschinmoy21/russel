name: Release

# Tag pushes build the binaries and dashboard dist that contrib/install.sh
# download mode consumes and upload them to a draft release. The microVM
# kernel is not built here (linux from source took ~2h on hosted runners): the
# maintainer uploads a local `nix build .#microvm-kernel` plus its GPL-2.0
# corresponding source (`.#microvm-kernel-source`) and publishes the draft
# with contrib/release-kernel.sh.
#   sudo RUSSEL_VERSION=<tag> RUSSEL_RELEASE_BASE=<base> ./contrib/install.sh host
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Binaries ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # ubuntu-22.04 is glibc 2.35. ubuntu-latest (24.04) binaries fail to
      # start on Debian 12 and Ubuntu 22.04 VPS images.
      # Every action is pinned to an immutable commit SHA: this workflow's
      # publish job holds `contents: write`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binaries
        run: cargo build --release -p russel-cli -p russel-ctrl

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build dashboard dist
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
        working-directory: dashboard

      - name: Package x86_64 assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          test -x target/release/russel
          test -x target/release/russel-ctrl
          test -f dashboard/dist/index.html
          # Written by `bun run build`; ships the npm deps' license notices.
          test -s dashboard/dist/THIRD-PARTY-LICENSES.txt
          install -m 0755 target/release/russel "russel-${tag}-x86_64"
          install -m 0755 target/release/russel-ctrl "russel-ctrl-${tag}-x86_64"
          install -m 0644 contrib/russel-ctrl.service "russel-ctrl-${tag}.service"
          tar -czf "russel-dashboard-${tag}.tar.gz" -C dashboard/dist .
          ls -l "russel-${tag}-x86_64" "russel-ctrl-${tag}-x86_64" \
            "russel-ctrl-${tag}.service" "russel-dashboard-${tag}.tar.gz" \
            LICENSE NOTICE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-binaries
          if-no-files-found: error
          retention-days: 7
          path: |
            russel-${{ github.ref_name }}-x86_64
            russel-ctrl-${{ github.ref_name }}-x86_64
            russel-ctrl-${{ github.ref_name }}.service
            russel-dashboard-${{ github.ref_name }}.tar.gz
            LICENSE
            NOTICE

  publish:
    name: Publish ${{ github.ref_name }}
    needs: [binaries]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # contrib/release-kernel.sh also rewrites SHA256SUMS; never let two
    # publish runs for one tag interleave on top of that.
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: gh cannot infer the repo from a remote.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd artifacts
          assets=(
            "russel-${tag}-x86_64"
            "russel-ctrl-${tag}-x86_64"
            "russel-ctrl-${tag}.service"
            "russel-dashboard-${tag}.tar.gz"
            LICENSE
            NOTICE
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "missing release asset: ${asset}" >&2
              ls -la >&2
              exit 1
            fi
          done
          sha256sum "${assets[@]}" >SHA256SUMS

          kernel="russel-kernel-${tag}-x86_64.bzImage"
          kernel_source="russel-kernel-${tag}-source.tar"
          if gh release view "${tag}" >/dev/null 2>&1; then
            # A re-run must keep the locally uploaded kernel's and kernel
            # source's checksums. If the release lists SHA256SUMS, a failed
            # download fails the job rather than silently publishing sums
            # without those lines.
            names="$(gh release view "${tag}" --json assets -q '.assets[].name')"
            if grep -qxF SHA256SUMS <<<"${names}"; then
              gh release download "${tag}" -p SHA256SUMS -O previous-sums
              for local_asset in "${kernel}" "${kernel_source}"; do
                if grep -qxF "${local_asset}" <<<"${names}"; then
                  if ! grep -F "  ${local_asset}" previous-sums >>SHA256SUMS; then
                    echo "${local_asset} is uploaded but has no SHA256SUMS line; rerun contrib/release-kernel.sh ${tag}" >&2
                    exit 1
                  fi
                fi
              done
            fi
          fi
          cat SHA256SUMS
          ls -l "${assets[@]}" SHA256SUMS

          notes="$(mktemp)"
          cat >"${notes}" <<EOF
          # Russel ${tag}

          First tagged one-operator release.

          ## Compatibility

          - Architecture: x86_64 Linux
          - glibc >= 2.35 (Ubuntu 22.04, Debian 12, and newer)
          - NixOS: \`services.russel\`, not these binaries
          - Typical VPS (no KVM): containers only (\`type = "container"\`)

          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/daschinmoy21/russel/main/contrib/install.sh \\
            | sudo RUSSEL_VERSION=${tag} bash -s -- host
          \`\`\`

          On a KVM host, \`host\` also downloads \`russel-kernel-${tag}-x86_64.bzImage\`
          and installs it at \`/var/lib/russel/_pool/kernel/bzImage\`. Without
          \`/dev/kvm\` that step is skipped. \`all\` never fetches the kernel.

          ## Assets

          - \`russel-${tag}-x86_64\`
          - \`russel-ctrl-${tag}-x86_64\`
          - \`russel-ctrl-${tag}.service\`
          - \`russel-dashboard-${tag}.tar.gz\` (third-party npm licenses in \`THIRD-PARTY-LICENSES.txt\` inside)
          - \`russel-kernel-${tag}-x86_64.bzImage\`
          - \`russel-kernel-${tag}-source.tar\` (kernel corresponding source)
          - \`LICENSE\`, \`NOTICE\` (Apache-2.0; the kernel image is GPL-2.0)
          - \`SHA256SUMS\`

          ## Licenses

          Russel is Apache-2.0 (\`LICENSE\`, \`NOTICE\`). The microVM kernel
          image is Linux, licensed under GPL-2.0. Its complete corresponding
          source is \`russel-kernel-${tag}-source.tar\` in this release: the
          upstream tarball, the applied patches, the \`.config\`, and the Nix
          expressions and nixpkgs rev it was built with (see its \`README\`).
          EOF

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" --clobber "${assets[@]}" SHA256SUMS
            gh release edit "${tag}" --title "Russel ${tag}" --notes-file "${notes}"
          else
            # Draft until contrib/release-kernel.sh adds the kernel and its
            # SHA256SUMS line, so no one downloads a release without a kernel.
            gh release create "${tag}" --draft --title "Russel ${tag}" \
              --notes-file "${notes}" "${assets[@]}" SHA256SUMS
          fi
          gh release view "${tag}"
