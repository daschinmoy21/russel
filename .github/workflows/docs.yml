name: Docs

# Mintlify builds the docs site from docs/ on every push to main (its GitHub
# app, not this workflow). This job only stops a PR from merging a page that
# won't build or a link that goes nowhere. See docs/README.md.
on:
  pull_request:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Docs build and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On a page that doesn't parse as MDX, mint prints the syntax error and
      # then retries forever instead of exiting, so bound it.
      - name: mint broken-links
        run: |
          status=0
          timeout 240 npx --yes mint@4.2.942 broken-links || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::mint did not finish: look above for 'Syntax error - Unable to parse <page>' (MDX: put <placeholders> and {braces} in backticks)"
          fi
          exit "$status"
