[workspace]
members = [
    "crates/agent",
    "crates/cli",
    "crates/ctrl",
    "crates/core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/daschinmoy21/russel"
version = "0.1.1"

# Production code must not use unwrap/expect; #[cfg(test)] modules may allow them.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
axum = "0.8.7"
clap = { version = "4.5.53", features = ["derive", "env"] }
http-body-util = "0.1"
libc = "0.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.138"
tempfile = "3.25.0"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "signal", "fs", "net", "io-util"] }
tokio-stream = "0.1.18"
toml = "0.9.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
