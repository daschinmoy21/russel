[service]
name = "api"
source = "."
port = 3000
memory = "256mb"
type = "container"
# Binary name produced by `go build` (last component of module path).
# russel uses this for ExecStart in the generated deploy.nix.
bin = "basic-http"
# debug = true   # enable bash, curl, /usr/bin/env in container rootfs

[database.postgres]
enabled = false

[database.redis]
enabled = false
