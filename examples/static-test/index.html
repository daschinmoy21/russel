<!DOCTYPE html>
<html>
<head>
    <title>Russel Auto-Flake Static Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e38 0%, #0d0d1a 100%);
            color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 16px;
            border: 1px rgba(255, 255, 255, 0.1) solid;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 {
            color: #00f0ff;
            margin-bottom: 0.5rem;
        }
        p {
            color: #a0a0c0;
            font-size: 1.1rem;
        }
        .badge {
            display: inline-block;
            background: #00ff88;
            color: #0d0d1a;
            font-weight: bold;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Russel Zero-Config Deployment</h1>
        <p>This web page was deployed without writing any <code>flake.nix</code>!</p>
        <p>Russel automatically detected the project format and generated a custom Nix build definition.</p>
        <div class="badge">Running in MicroVM</div>
    </div>
</body>
</html>
