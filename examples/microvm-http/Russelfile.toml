# microvm-http — same Go app as basic-http, but type = "microvm".
# Requires KVM (/dev/kvm); ctrl runs unprivileged, passt publishes the port.
# Sources live in this directory (copied from basic-http; keep in sync if you
# change the demo app).

[service]
name = "microvm-http"
source = "."
port = 3000
memory = "256mb"
# More than one vCPU: guards against the Cloud Hypervisor boot hang (#510).
cpus = 2
type = "microvm"
bin = "basic-http"
