# microvm-http — same Go app as basic-http, but type = "microvm".
# Requires KVM + TAP (often: sudo -E russel-ctrl). Sources live in this directory
# (copied from basic-http; keep in sync if you change the demo app).

[service]
name = "microvm-http"
source = "."
port = 3000
memory = "256mb"
type = "microvm"
bin = "basic-http"
